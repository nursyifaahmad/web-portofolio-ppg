server {
    listen 80;
    server_name ppg.ahmadnursyifa.my.id localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Allow Google Drive and YouTube embedding for videos & documents
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; frame-src 'self' https://drive.google.com https://www.youtube.com; connect-src 'self';" always;

    # Cache immutable Astro assets
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Cache static documents and media (PDFs, Office files, Images, Code)
    location ~* \.(?:pdf|docx|doc|pptx|ppt|xlsx|xls|png|jpg|jpeg|gif|svg|webp|ico|txt|ino)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Normal routing with 404 fallback
    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    # Custom 404 error page
    error_page 404 /404.html;
}
