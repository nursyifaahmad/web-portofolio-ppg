services:
  eportfolio-web:
    build: .
    container_name: eportfolio-web
    restart: unless-stopped
    ports:
      # Port 3070: safe from Immich (2283/3001), Wedding Tracker (3050), and Algocraft (3060)
      - "3070:80"

    environment:
      - NODE_ENV=production
    networks:
      - eportfolio-net

networks:
  eportfolio-net:
    name: eportfolio-net
    driver: bridge
